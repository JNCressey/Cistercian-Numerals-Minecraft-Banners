<html class="no-js">
<head>
	<script type="module" src="./cistercian-numerals-banner-generator-frontend.js"></script>
	
	<style>
		#generatorWidget {
			border: 1px solid #aaa;
			padding: 0.5em;
			border-radius: 4px;
		}
		
		#outputLeft, #outputRight {
			overflow:scroll;
		}
	</style>
	
</head>
<body>


	<noscript>
		The interactive generator requires Javascript enabled to work.
	</noscript>
	
	<div id="generatorWidget">
		<h2>Interactive Generator</h2>
		
		<form id="generatorForm" method="GET">
			<label for="numberInput">Number Input:</label>
			<input id="numberInput" name="numberInput" type="number" required min="0" max="9999">
			<br>
			
			<label> Background Colour:</label>
			<select id="backgroundColor" name="backgroundColor" required></select>
			<br>
			
			<label>Foreground Colour:</label>
			<select id="foregroundColor" name="foregroundColor" required></select>
			<br>
			
			<button type="submit">Generate banner patterns</button>
		</form>
		<pre id="outputNumeralDetails"></pre>
		<pre id="outputLeft" class="js-only"></pre>
		<pre id="outputRight" class="js-only"></pre>
	
	</details>
	
</body>
</html>
