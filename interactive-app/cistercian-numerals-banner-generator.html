<html class="no-js">
<head>
	<script type="module" src="./cistercian-numerals-banner-generator-frontend.js"></script>
	
	<style>
	  html.no-js .js-only { display: none; }
	</style>
	<script>
		document.documentElement.classList.remove("no-js");
	</script>
	
</head>
<body>


	<noscript>
		The interactive generator requires Javascript enabled to work.
	</noscript>
	
	<form id="generatorForm" class="js-only">
		<label for="numberInput">Number Input:</label>
		<input id="numberInput" name="numberInput" type="number" value="0" required min="0" max="9999">
		<br>
		
		<label> Background Colour:</label>
		<select id="backgroundColor" name="backgroundColor"></select>
		<br>
		
		<label>Foreground Colour:</label>
		<select id="foregroundColor" name="foregroundColor"></select>
		<br>
		
		<button type="submit">Generate banner patterns</button>
	</form>
	<pre id="outputLeft" class="js-only">left:</pre>
	<pre id="outputRight" class="js-only">right:</pre>
	
</body>
</html>
