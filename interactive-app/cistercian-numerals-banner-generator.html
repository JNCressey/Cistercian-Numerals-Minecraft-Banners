<html>
<head>
	<script type="module" src="./cistercian-numerals-banner-generator-frontend.js"></script>
	
	<style>
		
		#generatorWidget {
			border: 1px solid #aaa;
			padding: 0.5em;
			border-radius: 4px;
		}
		
		#outputLeft, #outputRight {
			overflow:scroll;
		}
	</style>
	
	<link rel="stylesheet" href="./cistercian-numerals-banner-generator.css">
	
</head>
<body>


	
	<div id="generatorWidget">
		<h2>Interactive Generator</h2>
		
		<noscript>
			<p>The interactive generator requires Javascript enabled to work.</p>
		</noscript>
		
		<form id="generatorForm">
			<label for="numberInput">Number Input:</label>
			<input id="numberInput" name="numberInput" type="number" required min="0" max="9999" value="2026" disabled>
			<br>
			
			<label> Background Colour:</label>
			<select id="backgroundColor" name="backgroundColor" required disabled>
				<noscript><option value="WHITE">White</option></noscript>
			</select>
			<br>
			
			<label>Foreground Colour:</label>
			<select id="foregroundColor" name="foregroundColor" required disabled>
				<noscript><option value="BLACK" >Black</option></noscript>
			</select>
			<br>
			
			<button type="submit" disabled>Generate banner patterns</button>
		</form>
		
		<pre id="outputNumeralDetails"><noscript># For number 2026</noscript></pre>
		
		<pre id="outputLeft"><noscript>## Left 
Give command:
/give @p minecraft:white_banner[banner_patterns=[{pattern:half_horizontal,color:black},{pattern:stripe_top,color:white},{pattern:half_horizontal_bottom,color:black},{pattern:stripe_bottom,color:white},{pattern:stripe_middle,color:white},{pattern:stripe_right,color:black}]] 1

Steps:
- White Banner
- Black Per_fess
- White Chief
- Black Per_fess_inverted
- White Base
- White Fess
- Black Pale_sininster</noscript></pre>

		<pre id="outputRight"><noscript>## Right 
Give command:
/give @p minecraft:white_banner[banner_patterns=[{pattern:stripe_right,color:black},{pattern:half_horizontal_bottom,color:white},{pattern:stripe_middle,color:white},{pattern:stripe_left,color:black}]] 1

Steps:
- White Banner
- Black Pale_sininster
- White Per_fess_inverted
- White Fess
- Black Pale_dexter</noscript></pre>
	
	
	<div id="craftingLists">
		<div id="outputSectionLeft">
			<div id="outputDescriptionLeft">
				<noscript>
					<h3>Left Banner: 2020</h3>
				</noscript>
			</div>
			<ol id="outputListLeft">
				<noscript>
					<li><span>White Banner</span><img src="./icons/WHITE-banner.png"></li>
					<li><span>Black Dye</span><img src="./icons/BLACK-dye.png"><span>Per_fess</span><img src="./icons/half_horizontal.png"></li>
					<li><span>White Dye</span><img src="./icons/WHITE-dye.png"><span>Chief</span><img src="./icons/stripe_top.png"></li>
					<li><span>Black Dye</span><img src="./icons/BLACK-dye.png"><span>Per_fess_inverted</span><img src="./icons/half_horizontal_bottom.png"></li>
					<li><span>White Dye</span><img src="./icons/WHITE-dye.png"><span>Base</span><img src="./icons/stripe_bottom.png"></li>
					<li><span>White Dye</span><img src="./icons/WHITE-dye.png"><span>Fess</span><img src="./icons/stripe_middle.png"></li>
					<li><span>Black Dye</span><img src="./icons/BLACK-dye.png"><span>Pale_sininster</span><img src="./icons/stripe_right.png"></li>
				</noscript>
			</ol>
		</div>
		
		<div id="outputSectionRight">
			<div id="outputDescriptionRight">
				<noscript>
					<h3>Right Banner: 6</h3>
				</noscript>
			</div>
			<ol id="outputListRight">
				<noscript>
					<li><span>White Banner</span><img src="./icons/WHITE-banner.png"></li>
					<li><span>Black Dye</span><img src="./icons/BLACK-dye.png"><span>Pale_sininster</span><img src="./icons/stripe_right.png"></li>
					<li><span>White Dye</span><img src="./icons/WHITE-dye.png"><span>Per_fess_inverted</span><img src="./icons/half_horizontal_bottom.png"></li>
					<li><span>White Dye</span><img src="./icons/WHITE-dye.png"><span>Fess</span><img src="./icons/stripe_middle.png"></li>
					<li><span>Black Dye</span><img src="./icons/BLACK-dye.png"><span>Pale_dexter</span><img src="./icons/stripe_left.png"></li>
				</noscript>
			</ol>
		</div>
	</div>
	
</body>
</html>
