<html>
<head>

	<script type="module">
		import {COLOR, PATTERN, BANNER_SIDE, CistercianNumeralBannerGenerator} from "./cistercian-numerals-banner-generator.js";
		
		export function updateOutput(e){
			e.preventDefault();   // stops the POST
			const num = e.target.numberInput.value;
			
			const colors = {foreground:COLOR.BLACK,background:COLOR.WHITE};
			
			const generator = new CistercianNumeralBannerGenerator(num,colors);
			
			/**
				@param {PATTERN} p
				@return string
			*/
			function patternKeyFromValue(p){
				return Object.keys(PATTERN).find(k=>PATTERN[k] === p).toLowerCase();
			}
			
			/**
				@param {BANNER_SIDE} side
				@return {string}
			*/
			function output(side){
				const giveCommand = generator.getCommandGiveBanner(side);
				const bannerSpecification = generator.getBannerSpecification(side);
				const patternSteps = 
					bannerSpecification
					.patterns
					.map(({color,pattern}) => 
						`${color.toLowerCase()} ${patternKeyFromValue(pattern)}`
					);
				const stepList = 
					[
						`${bannerSpecification.baseColor.toLowerCase()} banner`,
						...patternSteps
					]
					.map(i=>`- ${i}`)
					.join("\n");
				return `give command:\n${giveCommand}\n\nSteps:\n${stepList}`;
			}
			
			document.getElementById("giveCommandLeft").textContent = `#left \n${output(BANNER_SIDE.LEFT)}`;
			document.getElementById("giveCommandRight").textContent = `#right \n${output(BANNER_SIDE.RIGHT)}`;
		}
		
		document.getElementById("generatorForm").addEventListener("submit", updateOutput);
	</script>

</head>
<body>

	<form id="generatorForm">
		<label for="numberInput">Number input:</label>
		<input id="numberInput" name="numberInput" type="number" value="0" required min="0" max="9999">
		<button type="submit">Generate banner patterns</button>
	</form>
	<pre id="giveCommandLeft">left:</pre>
	<pre id="giveCommandRight">right:</pre>
	
</body>
</html>
